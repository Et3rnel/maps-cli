name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  BINARY_NAME: maps-cli
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: maps-cli-linux-amd64
          - os: macos-13
            target: x86_64-apple-darwin
            asset_name: maps-cli-darwin-amd64
          - os: macos-14
            target: aarch64-apple-darwin
            asset_name: maps-cli-darwin-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Run checks
        run: just lint

      - name: Run tests
        run: cargo test --target "${{ matrix.target }}"

      - name: Build release binary
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Package release assets
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/$BINARY_NAME" "dist/$ASSET_NAME"
          chmod +x "dist/$ASSET_NAME"
          tar -C dist -czf "dist/$ASSET_NAME.tar.gz" "$ASSET_NAME"
          shasum -a 256 "dist/$ASSET_NAME" "dist/$ASSET_NAME.tar.gz" > "dist/$ASSET_NAME.sha256"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/

  release:
    name: Publish GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: maps-cli-*
          merge-multiple: true
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
